    <script>
      (function () {
        // Matches Tailwind `md` (768px) and existing hero layout/CSS:
        // mobile = max-width 768px, desktop = min-width 769px
        var mq = window.matchMedia("(max-width: 768px)");
        var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

        function applyHeroMedia() {
          var mobile = document.querySelector("#hero .hero-media-mobile");
          var desktop = document.querySelector("#hero .hero-media-desktop");
          if (!mobile || !desktop) return;

          var video = mobile.querySelector("video");
          var img = desktop.querySelector("img");
          var isMobile = mq.matches;
          var preferStatic = reducedMotion.matches;

          if (isMobile) {
            mobile.hidden = false;
            mobile.removeAttribute("aria-hidden");
            desktop.hidden = true;
            desktop.setAttribute("aria-hidden", "true");

            if (img) {
              img.removeAttribute("src");
              img.removeAttribute("srcset");
            }

            if (video) {
              if (preferStatic) {
                // Keep poster frame only — do not load or autoplay video
                video.pause();
                if (video.getAttribute("src")) {
                  video.removeAttribute("src");
                  video.load();
                }
                video.preload = "none";
              } else {
                var vsrc = video.getAttribute("data-src");
                if (vsrc && video.getAttribute("src") !== vsrc) {
                  video.setAttribute("src", vsrc);
                  video.preload = "auto";
                }
                var playPromise = video.play();
                if (playPromise && typeof playPromise.catch === "function") {
                  playPromise.catch(function () {});
                }
              }
            }
          } else {
            desktop.hidden = false;
            desktop.removeAttribute("aria-hidden");
            mobile.hidden = true;
            mobile.setAttribute("aria-hidden", "true");

            if (video) {
              video.pause();
              if (video.getAttribute("src")) {
                video.removeAttribute("src");
                video.load();
              }
            }

            if (img) {
              var isrc = img.getAttribute("data-src");
              if (isrc && img.getAttribute("src") !== isrc) {
                img.setAttribute("src", isrc);
                img.setAttribute("loading", "eager");
                img.setAttribute("fetchpriority", "high");
              }
            }
          }
        }

        function whenHeroReady(fn) {
          if (document.querySelector("#hero .hero-bg-layer")) {
            fn();
            return;
          }
          var obs = new MutationObserver(function () {
            if (document.querySelector("#hero .hero-bg-layer")) {
              obs.disconnect();
              fn();
            }
          });
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }

        whenHeroReady(function () {
          applyHeroMedia();
          if (mq.addEventListener) mq.addEventListener("change", applyHeroMedia);
          else if (mq.addListener) mq.addListener(applyHeroMedia);
          if (reducedMotion.addEventListener) reducedMotion.addEventListener("change", applyHeroMedia);
          else if (reducedMotion.addListener) reducedMotion.addListener(applyHeroMedia);
        });
      })();
    </script>
